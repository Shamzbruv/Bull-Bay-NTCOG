<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="login-wrap">
        <form id="login-form" class="glass-panel login-card">
            <h1 class="login-title">Church Event Control</h1>
            <p class="login-subtitle">Enter the admin password to continue.</p>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" autocomplete="current-password" autofocus required>
            </div>
            <p id="login-error" class="login-error hidden"></p>
            <button type="submit" class="btn btn-primary" id="login-submit-btn">Log In</button>
        </form>
    </div>
    <script src="login.js"></script>
</body>

</html>
